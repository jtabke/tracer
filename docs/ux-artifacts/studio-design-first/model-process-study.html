<script>
  (() => {
    const root = document.getElementById("tracer-orbit-model-study");
    if (!root) return;
    const app = root.querySelector(".mp-app");
    const data = JSON.parse(document.getElementById("tracer-orbit-model-data").textContent);
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const groups = [
      ["Intent", ["product", "goal", "target"]],
      ["Engineering", ["function", "requirement", "design", "component", "interface"]],
      ["Exploration", ["concept", "experiment", "decision"]],
      ["Build & evidence", ["build_configuration", "evaluation", "finding"]],
      ["Review & release", ["change_assessment", "release"]],
    ];
    const state = {
      view: "overview",
      stage: "flow",
      selected: "evaluation",
      configure: false,
      mode: "Visual",
      draft: clone(data.schema),
      saved: clone(data.schema),
      baseVersion: 1,
      currentVersion: 1,
      selectedRoute: "evaluated_by:2",
      editKind: "type",
      text: "",
      error: "",
      message: "",
      dirty: false,
    };
    const esc = (value) =>
      String(value ?? "").replace(
        /[&<>"']/g,
        (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
      );
    const human = (name) => name.replaceAll("_", " ").replace(/^./, (char) => char.toUpperCase());
    let rememberedSnapshot = "";
    function routes() {
      return Object.entries(state.draft.relationshipTypes).flatMap(([name, definition]) =>
        (definition.workflow ?? []).map((route, index) => ({
          key: `${name}:${index}`,
          name,
          index,
          ...route,
          from: route.direction === "reverse" ? route.target : route.source,
          to: route.direction === "reverse" ? route.source : route.target,
        })),
      );
    }
    function remember() {
      const snapshot = {
        selected: state.selected,
        view: state.view,
        stage: state.stage,
        configure: state.configure,
        mode: state.mode,
        draftPatch: patch(data.schema, state.draft),
        savedPatch: patch(data.schema, state.saved),
        baseVersion: state.baseVersion,
        currentVersion: state.currentVersion,
        selectedRoute: state.selectedRoute,
        editKind: state.editKind,
        error: state.error,
        dirty: state.dirty,
        textEdit:
          state.mode === "Text" ? textEdit(JSON.stringify(state.draft, null, 2), state.text) : null,
      };
      const serialized = JSON.stringify(snapshot);
      if (serialized.length < 15000) {
        rememberedSnapshot = serialized;
        window.openai
          ?.setWidgetState?.({
            modelContent: {
              selectedType: state.selected,
              view: state.view,
              configurationMode: state.configure ? state.mode : "read",
            },
            privateContent: snapshot,
          })
          ?.catch(() => {});
      }
    }
    function restore(snapshot) {
      if (!snapshot || !Array.isArray(snapshot.draftPatch) || !Array.isArray(snapshot.savedPatch))
        return;
      Object.assign(state, snapshot);
      state.draft = applyPatch(data.schema, snapshot.draftPatch);
      state.saved = applyPatch(data.schema, snapshot.savedPatch);
      const formatted = JSON.stringify(state.draft, null, 2);
      state.text = snapshot.textEdit
        ? formatted.slice(0, snapshot.textEdit.start) +
          snapshot.textEdit.value +
          formatted.slice(snapshot.textEdit.end)
        : formatted;
    }
    function textEdit(before, after) {
      let start = 0,
        end = before.length,
        last = after.length;
      while (start < Math.min(end, last) && before[start] === after[start]) start++;
      while (end > start && last > start && before[end - 1] === after[last - 1]) {
        end--;
        last--;
      }
      return { start, end, value: after.slice(start, last) };
    }
    function patch(before, after, path = []) {
      if (JSON.stringify(before) === JSON.stringify(after)) return [];
      if (
        before &&
        after &&
        typeof before === "object" &&
        typeof after === "object" &&
        !Array.isArray(before) &&
        !Array.isArray(after)
      )
        return [...new Set([...Object.keys(before), ...Object.keys(after)])].flatMap((key) =>
          patch(before[key], after[key], [...path, key]),
        );
      return [{ path, ...(after === undefined ? { remove: true } : { value: after }) }];
    }
    function applyPatch(base, operations) {
      const value = clone(base);
      for (const operation of operations) {
        const path = operation.path;
        let owner = value;
        for (const name of path.slice(0, -1)) {
          owner[name] ??= {};
          owner = owner[name];
        }
        if (operation.remove) delete owner[path.at(-1)];
        else owner[path.at(-1)] = clone(operation.value);
      }
      return value;
    }
    restore(window.openai?.widgetState?.privateContent);
    function typeOptions() {
      return Object.keys(state.draft.entityTypes)
        .map(
          (name) =>
            `<option value="${esc(name)}" ${name === state.selected ? "selected" : ""}>${esc(human(name))}</option>`,
        )
        .join("");
    }
    function overview() {
      const counts = (name) =>
        routes().filter((route) => route.from === name || route.to === name).length;
      const extras = Object.keys(state.draft.entityTypes).filter(
        (name) => !groups.some(([, names]) => names.includes(name)),
      );
      const visibleGroups = extras.length ? [...groups, ["Ungrouped", extras]] : groups;
      return `<div class="mp-overview" aria-label="Full Orbit type workflow"><svg class="mp-overview-lines" aria-hidden="true"></svg><div class="mp-lanes">${visibleGroups
        .map(
          ([title, names]) =>
            `<section class="mp-lane"><h2>${title}</h2>${names
              .filter((name) => state.draft.entityTypes[name])
              .map(
                (name) =>
                  `<button type="button" class="mp-node cursor-interaction" data-type="${name}" data-point="${name}" aria-pressed="${state.selected === name}"><strong>${esc(human(name))}</strong><span>${counts(name)} authored paths</span></button>`,
              )
              .join("")}</section>`,
        )
        .join(
          "",
        )}</div></div><div class="mp-selection"><div><p>${human(state.selected)} · ${routes().filter((route) => route.from === state.selected || route.to === state.selected).length} highlighted paths</p><span class="mp-count">${Object.keys(state.draft.entityTypes).length} types · ${routes().length} authored paths · grouped for reading</span></div><button type="button" class="cursor-interaction" data-action="focus">Explore inputs and outputs →</button></div>`;
    }
    function routeButton(route, direction) {
      const other = direction === "input" ? route.from : route.to;
      return `<button type="button" class="mp-route cursor-interaction ${route.feedback ? "mp-feedback" : ""}" data-route="${esc(route.key)}" data-route-point="${esc(route.key)}" data-side="${direction}" aria-pressed="${state.editKind === "connection" && state.selectedRoute === route.key}"><strong>${esc(human(other))}</strong><span>${esc(route.label)}${route.feedback ? " · feedback" : ""}</span></button>`;
    }
    function focus() {
      const all = routes();
      const incoming = all.filter(
        (route) => route.to === state.selected && route.from !== state.selected,
      );
      const outgoing = all.filter(
        (route) => route.from === state.selected && route.to !== state.selected,
      );
      const self = all.filter(
        (route) => route.from === state.selected && route.to === state.selected,
      );
      return `<div class="mp-focus" aria-label="${esc(human(state.selected))} input and output workflow"><svg class="mp-focus-lines" aria-hidden="true"></svg><section class="mp-route-list"><h2>Inputs · ${incoming.length}</h2>${incoming.map((route) => routeButton(route, "input")).join("") || '<p class="mp-muted">No authored incoming path</p>'}</section><section class="mp-center" data-center><div class="mp-center-type"><h2>${esc(human(state.selected))}</h2><p class="mp-muted">${Object.keys(state.draft.entityTypes[state.selected].fields).length} fields</p><button type="button" class="cursor-interaction" data-action="inspect-type">${state.configure ? "Edit type" : "Type definition"}</button>${self.map((route) => `<button type="button" class="mp-self cursor-interaction" data-route="${route.key}">↶ ${esc(route.label)}</button>`).join("")}</div></section><section class="mp-route-list"><h2>Outputs · ${outgoing.length}</h2>${outgoing.map((route) => routeButton(route, "output")).join("") || '<p class="mp-muted">No authored outgoing path</p>'}</section></div>`;
    }
    function typeInspection() {
      const fields = state.draft.entityTypes[state.selected].fields;
      const samples = data.samples[state.selected] ?? [];
      return `<section class="mp-inspection" aria-label="Selected type definition">${
        state.configure
          ? `<div class="mp-fields"><span>Field</span><span>Type</span><span>Required</span>${Object.entries(
              fields,
            )
              .map(
                ([name, definition]) =>
                  `<span>${esc(name)}</span><select aria-label="${esc(name)} field type" data-field-type="${esc(name)}">${["string", "number", "boolean", "json"].map((type) => `<option ${definition.type === type ? "selected" : ""}>${type}</option>`).join("")}</select><label class="mp-check"><input type="checkbox" aria-label="${esc(name)} required" data-field-required="${esc(name)}" ${definition.required ? "checked" : ""}></label>`,
              )
              .join(
                "",
              )}</div><div class="mp-actions" data-add-field style="margin-top:16px"><input aria-label="New field name" name="field" placeholder="New field name" required pattern="[a-z][a-z0-9_]*"><select aria-label="New field type" name="type"><option>string</option><option>number</option><option>boolean</option><option>json</option></select><button type="button" class="cursor-interaction" data-action="add-field">Add field</button></div>`
          : `<p>${Object.keys(fields)
              .map((name) => esc(name))
              .join(
                " · ",
              )}</p><div class="mp-example">${samples.map((sample) => `<div><span class="mp-muted">${esc(sample.key)}</span><p>${esc(sample.title)}</p></div>`).join("")}</div>`
      }</section>`;
    }
    function connectionInspection() {
      const route = routes().find((value) => value.key === state.selectedRoute);
      if (!route) return typeInspection();
      const definition = state.draft.relationshipTypes[route.name];
      return `<section class="mp-inspection" aria-label="Selected connection definition">${state.configure ? `<div class="mp-form"><label>Flow label<input aria-label="Flow label" data-edit-route="label" value="${esc(route.label)}"></label><label>Flow direction<select aria-label="Flow direction" data-edit-route="direction"><option value="forward" ${route.direction === "forward" ? "selected" : ""}>Forward from native source</option><option value="reverse" ${route.direction === "reverse" ? "selected" : ""}>Reverse from native source</option></select></label><label class="mp-check"><input type="checkbox" aria-label="Feedback path" data-edit-route="feedback" ${route.feedback ? "checked" : ""}>Feedback path</label></div>` : ""}<div class="mp-rule" style="margin-top:18px"><div><span class="mp-muted">Native trace definition</span><code>${esc(route.name)}: ${esc(route.source)} → ${esc(route.target)}</code></div><div><span class="mp-muted">Allowed endpoints</span><code>Sources: ${esc(definition.source?.join(", ") ?? "Any")}</code><code>Targets: ${esc(definition.target?.join(", ") ?? "Any")}</code></div></div>${state.configure ? `<details style="margin-top:14px"><summary>Edit allowed endpoint sets</summary><div class="mp-form" style="margin-top:12px"><label>Sources<input aria-label="Allowed source types" data-endpoints="source" value="${esc(definition.source?.join(", ") ?? "")}"></label><label>Targets<input aria-label="Allowed target types" data-endpoints="target" value="${esc(definition.target?.join(", ") ?? "")}"></label></div></details>` : ""}<div class="mp-actions" style="margin-top:24px"><button type="button" class="cursor-interaction" data-action="follow-route">Explore ${human(route.to === state.selected ? route.from : route.to)} inputs and outputs →</button></div></section>`;
    }
    function notice() {
      return state.error
        ? `<p class="mp-notice" role="alert">${esc(state.error)}</p>`
        : state.message
          ? `<p class="mp-notice" role="status">${esc(state.message)}</p>`
          : "";
    }
    function render() {
      const isDefinition = state.stage === "definition";
      const route =
        state.editKind === "connection" &&
        routes().find((value) => value.key === state.selectedRoute);
      const selectedTitle = route
        ? `${human(route.from)} → ${human(route.to)}`
        : human(state.selected);
      const heading = isDefinition
        ? selectedTitle
        : state.configure
          ? "Configure model"
          : "Project model";
      const retainedView = state.view === "overview" ? "model overview" : "inputs and outputs";
      const modeControls = state.configure
        ? `<div class="mp-actions">${["Visual", "Text"].map((mode) => `<button type="button" class="cursor-interaction" data-mode="${mode}" aria-pressed="${state.mode === mode}">${mode}</button>`).join("")}</div>`
        : "";
      const flowControls = `<div class="mp-actions"><button type="button" class="cursor-interaction" data-action="overview" aria-pressed="${state.view === "overview"}">Overview</button><button type="button" class="cursor-interaction" data-action="focus" aria-pressed="${state.view === "focus"}">Inputs and outputs</button></div><label>Focus type<select aria-label="Focus type" data-selected>${typeOptions()}</select></label>`;
      const body =
        state.configure && state.mode === "Text"
          ? `<label for="mp-schema-text" class="mp-muted">Project schema</label><textarea id="mp-schema-text" class="mp-text" aria-label="Project schema JSON">${esc(state.text)}</textarea>`
          : isDefinition
            ? `<div class="mp-definition">${route ? connectionInspection() : typeInspection()}</div>`
            : state.view === "overview"
              ? overview()
              : focus();
      app.innerHTML = `<header class="mp-top"><strong>Tracer</strong><span class="mp-muted">Orbit R1 / Project model</span></header><main class="mp-page">${isDefinition ? `<button type="button" class="mp-return cursor-interaction" data-action="return-flow">← Return to ${esc(human(state.selected))} ${retainedView}</button>` : ""}<div class="mp-heading"><div><span class="mp-muted">${isDefinition ? `${state.configure ? "Configure model" : "Project model"} / ${route ? "Workflow path" : "Type definition"}` : state.configure ? "Model draft" : "Orbit development workflow"}</span><h1>${esc(heading)}</h1></div><div class="mp-actions">${state.configure ? `<button type="button" class="mp-primary cursor-interaction" data-action="save" ${state.error ? "disabled" : ""}>Save preview model</button><button type="button" class="cursor-interaction" data-action="cancel">Cancel</button>` : '<button type="button" class="cursor-interaction" data-action="configure">Configure model</button>'}</div></div>${state.configure || !isDefinition ? `<div class="mp-toolbar">${modeControls}${isDefinition ? "" : flowControls}</div>` : ""}${isDefinition ? `<div class="mp-reference"><p>${route ? `${esc(route.label)}${route.feedback ? " · feedback path" : ""}` : `${Object.keys(state.draft.entityTypes[state.selected].fields).length} fields · ${routes().filter((value) => value.from === state.selected || value.to === state.selected).length} authored paths`}</p><span class="mp-muted">In ${esc(human(state.selected))} ${retainedView}</span></div>` : ""}${state.configure ? `<div class="mp-draft-line"><span>Based on v${state.baseVersion} · Current project v${state.currentVersion}${state.dirty ? " · Unsaved changes" : ""}</span><button type="button" class="cursor-interaction" data-action="simulate-conflict">Simulate newer project model</button></div>` : !isDefinition ? '<p class="mp-muted">Presentation groups · solid inputs/outputs · dashed feedback</p>' : ""}${notice()}${body}</main><footer class="mp-footer">Design study · actual Orbit schema and authored workflow · preview changes only</footer>`;
      requestAnimationFrame(draw);
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }
    function connector(a, b, bounds, vertical) {
      const ar = a.getBoundingClientRect(),
        br = b.getBoundingClientRect();
      if (vertical || Math.abs(ar.left - br.left) < 3) {
        const down = br.top >= ar.top;
        const x1 = ar.left - bounds.left + ar.width / 2,
          y1 = (down ? ar.bottom : ar.top) - bounds.top;
        const x2 = br.left - bounds.left + br.width / 2,
          y2 = (down ? br.top : br.bottom) - bounds.top;
        const c = Math.max(16, Math.abs(y2 - y1) / 2),
          sign = down ? 1 : -1;
        return `M${x1} ${y1} C${x1} ${y1 + c * sign},${x2} ${y2 - c * sign},${x2} ${y2}`;
      }
      const right = br.left >= ar.left;
      const x1 = (right ? ar.right : ar.left) - bounds.left,
        y1 = ar.top - bounds.top + ar.height / 2;
      const x2 = (right ? br.left : br.right) - bounds.left,
        y2 = br.top - bounds.top + br.height / 2;
      const c = Math.max(12, Math.abs(x2 - x1) / 2),
        sign = right ? 1 : -1;
      return `M${x1} ${y1} C${x1 + c * sign} ${y1},${x2 - c * sign} ${y2},${x2} ${y2}`;
    }
    function draw() {
      const overviewEl = app.querySelector(".mp-overview"),
        focusEl = app.querySelector(".mp-focus");
      const diagram = overviewEl ?? focusEl;
      if (!diagram) return;
      const bounds = diagram.getBoundingClientRect(),
        svg = diagram.querySelector("svg");
      if (!bounds.width) return;
      svg.setAttribute("viewBox", `0 0 ${bounds.width} ${bounds.height}`);
      const vertical = bounds.width < 600;
      const paths = [];
      if (overviewEl && !vertical)
        for (const route of routes()) {
          const a = diagram.querySelector(`[data-point="${route.from}"]`),
            b = diagram.querySelector(`[data-point="${route.to}"]`);
          if (a && b)
            paths.push({
              d: overviewConnector(a, b, bounds),
              feedback: route.feedback,
              context: route.from !== state.selected && route.to !== state.selected,
            });
        }
      if (focusEl)
        for (const button of diagram.querySelectorAll("[data-route-point]")) {
          const route = routes().find((value) => value.key === button.dataset.routePoint),
            center = diagram.querySelector("[data-center]");
          const input = button.dataset.side === "input";
          if (route && center)
            paths.push({
              d: vertical
                ? narrowFocusConnector(button, center, bounds, input)
                : connector(input ? button : center, input ? center : button, bounds, false),
              feedback: route.feedback,
            });
        }
      svg.innerHTML = `<defs><marker id="mp-model-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7"/></marker></defs>${paths.map((path) => `<path class="${path.feedback ? "mp-feedback" : ""} ${path.context ? "mp-context" : ""}" marker-end="url(#mp-model-arrow)" d="${path.d}"/>`).join("")}`;
    }
    function narrowFocusConnector(button, center, bounds, input) {
      const br = button.getBoundingClientRect(),
        cr = center.getBoundingClientRect();
      const edge = br.left - bounds.left,
        y = br.top - bounds.top + br.height / 2,
        cx = cr.left - bounds.left + cr.width / 2;
      if (input) {
        const top = cr.top - bounds.top;
        return `M${edge} ${y} H8 V${top - 16} H${cx} V${top}`;
      }
      const bottom = cr.bottom - bounds.top;
      return `M${cx} ${bottom} V${bottom + 16} H8 V${y} H${edge}`;
    }
    function overviewConnector(a, b, bounds) {
      const ar = a.getBoundingClientRect(),
        br = b.getBoundingClientRect();
      if (a === b) {
        const right = ar.right - bounds.left,
          mid = ar.top - bounds.top + ar.height / 2,
          top = ar.top - bounds.top,
          cx = ar.left - bounds.left + ar.width / 2;
        return `M${right} ${mid} H${right + 10} V${top - 12} H${cx} V${top}`;
      }
      if (Math.abs(ar.left - br.left) < 3) return connector(a, b, bounds, true);
      const forward = br.left > ar.left,
        sign = forward ? 1 : -1;
      const x1 = (forward ? ar.right : ar.left) - bounds.left,
        x2 = (forward ? br.left : br.right) - bounds.left;
      const y1 = ar.top - bounds.top + ar.height / 2,
        y2 = br.top - bounds.top + br.height / 2;
      const gutter = Math.min(ar.top, br.top) - bounds.top - 16;
      return `M${x1} ${y1} H${x1 + 8 * sign} V${gutter} H${x2 - 8 * sign} V${y2} H${x2}`;
    }
    function validate(schema) {
      if (!schema?.entityTypes || !schema?.relationshipTypes)
        return "Schema needs entityTypes and relationshipTypes.";
      if (!Object.keys(schema.entityTypes).length) return "At least one type is required.";
      for (const [name, type] of Object.entries(schema.entityTypes))
        if (
          !type?.fields ||
          Object.values(type.fields).some(
            (field) => !["string", "number", "boolean", "json"].includes(field.type),
          )
        )
          return `Invalid fields for ${name}.`;
      for (const [name, definition] of Object.entries(schema.relationshipTypes))
        for (const route of definition.workflow ?? []) {
          if (
            !schema.entityTypes[route.source] ||
            !schema.entityTypes[route.target] ||
            !["forward", "reverse"].includes(route.direction) ||
            !route.label?.trim()
          )
            return `Invalid workflow path in ${name}.`;
          if (
            (definition.source && !definition.source.includes(route.source)) ||
            (definition.target && !definition.target.includes(route.target))
          )
            return `Workflow endpoints must be permitted by ${name}.`;
        }
      return "";
    }
    app.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (
        !button.dataset.type &&
        !button.dataset.route &&
        !button.dataset.mode &&
        !button.dataset.action
      )
        return;
      const previousStage = state.stage;
      if (button.dataset.type) {
        state.selected = button.dataset.type;
        state.editKind = "type";
      }
      if (button.dataset.route) {
        state.selectedRoute = button.dataset.route;
        state.editKind = "connection";
        state.stage = "definition";
      }
      if (button.dataset.mode) {
        if (button.dataset.mode === "Visual" && state.error) {
          app.querySelector("textarea")?.focus();
          return;
        }
        if (button.dataset.mode === "Text" && state.mode !== "Text")
          state.text = JSON.stringify(state.draft, null, 2);
        state.mode = button.dataset.mode;
        state.stage = "definition";
      }
      switch (button.dataset.action) {
        case "overview":
          state.view = "overview";
          state.stage = "flow";
          break;
        case "focus":
          state.view = "focus";
          state.stage = "flow";
          break;
        case "inspect-type":
          state.editKind = "type";
          state.stage = "definition";
          break;
        case "return-flow":
          if (state.mode === "Text" && state.error) {
            app.querySelector("textarea")?.focus();
            return;
          }
          state.stage = "flow";
          state.mode = "Visual";
          break;
        case "follow-route": {
          const route = routes().find((value) => value.key === state.selectedRoute);
          if (route) state.selected = route.to === state.selected ? route.from : route.to;
          state.editKind = "type";
          state.stage = "flow";
          state.view = "focus";
          break;
        }
        case "configure":
          state.configure = true;
          state.view = "focus";
          state.stage = "definition";
          state.mode = "Visual";
          state.message = "";
          break;
        case "simulate-conflict":
          state.currentVersion++;
          state.message = "A newer project model is available. Your preview draft is retained.";
          break;
        case "save":
          if (state.baseVersion !== state.currentVersion) {
            state.error =
              "Model version changed. Your draft remains captured against the earlier version; cancel to start again from the current preview.";
            break;
          }
          state.saved = clone(state.draft);
          state.baseVersion++;
          state.currentVersion = state.baseVersion;
          state.configure = false;
          state.stage = "flow";
          state.dirty = false;
          state.message = "Preview model saved.";
          break;
        case "cancel":
          state.draft = clone(state.saved);
          state.baseVersion = state.currentVersion;
          state.configure = false;
          state.stage = "flow";
          state.error = "";
          state.message = "";
          state.dirty = false;
          break;
        case "add-field": {
          const controls = app.querySelector("[data-add-field]"),
            nameInput = controls.querySelector('[name="field"]');
          if (!nameInput.reportValidity()) return;
          const name = nameInput.value;
          if (Object.hasOwn(state.draft.entityTypes[state.selected].fields, name))
            state.error = "That field already exists.";
          else {
            state.draft.entityTypes[state.selected].fields[name] = {
              type: controls.querySelector('[name="type"]').value,
            };
            state.dirty = true;
            state.error = "";
          }
          break;
        }
      }
      render();
      if (previousStage !== state.stage || button.dataset.action === "configure") {
        const destination =
          state.stage === "definition"
            ? app.querySelector('[data-action="return-flow"]')
            : app.querySelector(
                `[data-action="${state.view === "overview" ? "overview" : "focus"}"]`,
              );
        destination?.focus();
      }
      remember();
    });
    app.addEventListener("change", (event) => {
      const el = event.target;
      if (el.dataset.editRoute === "label") {
        return;
      }
      if (
        !el.hasAttribute("data-selected") &&
        !el.dataset.fieldType &&
        !el.dataset.fieldRequired &&
        !el.dataset.editRoute &&
        !el.dataset.endpoints
      )
        return;
      if (el.hasAttribute("data-selected")) {
        state.selected = el.value;
        state.view = "focus";
        state.editKind = "type";
        state.stage = "flow";
        render();
        remember();
        return;
      }
      if (el.dataset.fieldType) {
        state.draft.entityTypes[state.selected].fields[el.dataset.fieldType].type = el.value;
        state.dirty = true;
      }
      if (el.dataset.fieldRequired) {
        state.draft.entityTypes[state.selected].fields[el.dataset.fieldRequired].required =
          el.checked;
        state.dirty = true;
      }
      if (el.dataset.editRoute) {
        const route = routes().find((value) => value.key === state.selectedRoute);
        state.draft.relationshipTypes[route.name].workflow[route.index][el.dataset.editRoute] =
          el.dataset.editRoute === "feedback" ? el.checked : el.value;
        state.dirty = true;
      }
      if (el.dataset.endpoints) {
        const route = routes().find((value) => value.key === state.selectedRoute);
        state.draft.relationshipTypes[route.name][el.dataset.endpoints] = el.value
          .split(",")
          .map((value) => value.trim())
          .filter(Boolean);
        state.dirty = true;
      }
      state.error = validate(state.draft);
      state.message = "";
      render();
      remember();
    });
    app.addEventListener("input", (event) => {
      if (event.target.dataset.editRoute === "label") {
        const route = routes().find((value) => value.key === state.selectedRoute);
        state.draft.relationshipTypes[route.name].workflow[route.index].label = event.target.value;
        state.dirty = true;
        state.error = validate(state.draft);
        app.querySelector('[data-action="save"]').disabled = !!state.error;
        const routeNode = app.querySelector(`[data-route="${state.selectedRoute}"] span`);
        if (routeNode)
          routeNode.textContent = event.target.value + (route.feedback ? " · feedback" : "");
        app.querySelector(".mp-draft-line > span").textContent =
          `Based on v${state.baseVersion} · Current project v${state.currentVersion} · Unsaved changes`;
        return;
      }
      if (event.target.id !== "mp-schema-text") return;
      state.text = event.target.value;
      state.dirty = true;
      try {
        const value = JSON.parse(state.text);
        state.error = validate(value);
        if (!state.error) {
          state.draft = value;
          if (!value.entityTypes[state.selected])
            state.selected = Object.keys(value.entityTypes)[0];
        }
      } catch {
        state.error =
          "Invalid JSON. The text draft is retained; fix it before saving or switching to Visual.";
      }
      const save = app.querySelector('[data-action="save"]');
      save.disabled = !!state.error;
      app.querySelector(".mp-draft-line > span").textContent =
        `Based on v${state.baseVersion} · Current project v${state.currentVersion} · Unsaved changes`;
      const noticeEl = app.querySelector("[role=alert]");
      if (noticeEl) noticeEl.textContent = state.error;
      else if (state.error)
        app
          .querySelector(".mp-toolbar")
          .insertAdjacentHTML(
            "afterend",
            `<p class="mp-notice" role="alert">${esc(state.error)}</p>`,
          );
      if (!state.error) app.querySelector("[role=alert]")?.remove();
      remember();
    });
    window.addEventListener("openai:set_globals", (event) => {
      const snapshot = event.detail?.globals?.widgetState?.privateContent;
      if (snapshot && JSON.stringify(snapshot) !== rememberedSnapshot) {
        restore(snapshot);
        render();
      }
    });
    const observer = new ResizeObserver(draw);
    observer.observe(app);
    render();
    if (globalThis.Tweak) {
      const options = { gaps: 22 };
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          app.style.setProperty("--mp-gap", `${options.gaps}px`);
          draw();
        },
      });
      tweak.addSlider(options, "gaps", {
        label: "Overview lane spacing",
        min: 18,
        max: 34,
        unit: "px",
      });
    }
  })();
</script>
