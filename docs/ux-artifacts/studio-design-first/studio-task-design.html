</style>
<script>
  (() => {
    const root = document.getElementById("tracer-task-design");
    const writer = crypto.randomUUID();
    const originalDesign =
      "Example control design uses the baseline duty profile and retains command timing while monitoring driver temperature.";
    const currentDesign =
      "Example blower-control design increases the proposed maximum duty from its baseline profile to improve pickup. Review energy, thermal, acoustic and command-timing effects before adoption; earlier baseline results remain captured against v1.";
    const records = [
      {
        key: "REQ-R03",
        type: "Requirement",
        version: 1,
        title: "Whole-product energy allocation",
        statement:
          "Allocate a draft average 60 W across the defined cleaning profile using the fictional 60 Wh usable-energy assumption; preserve reserve and profile assumptions.",
      },
      {
        key: "DES-01",
        type: "Design",
        version: 2,
        title: "Blower-control firmware design",
        statement: currentDesign,
      },
      {
        key: "DES-04",
        type: "Design",
        version: 1,
        title: "Battery and power schematic",
        statement:
          "Example schematic and energy allocation describe pack use, shared rail and transient supply needs.",
      },
      {
        key: "EVAL-R02",
        type: "Evaluation",
        version: 1,
        title: "Simulated baseline energy evaluation",
        statement:
          "SIMULATED: the invented duty-profile observation supports the old baseline allocation only. The later blower-control change has not been evaluated.",
      },
      {
        key: "FIND-R02",
        type: "Finding",
        version: 1,
        title: "Energy evidence predates profile change",
        statement:
          "The stored energy receipt captures the baseline firmware design. The edited duty profile creates a reason to review that evidence.",
      },
    ];
    const links = [
      ["REQ-R03", "DES-01", "realized by"],
      ["REQ-R03", "DES-04", "realized by"],
      ["REQ-R03", "EVAL-R02", "evaluated by"],
      ["DES-01", "EVAL-R02", "evaluated by"],
      ["DES-04", "EVAL-R02", "evaluated by"],
      ["DES-01", "DES-04", "depends on"],
      ["FIND-R02", "EVAL-R02", "finding from"],
    ];
    const modelTypes = [
      { key: "intent", title: "Intent", note: "Product goals" },
      { key: "requirement", title: "Requirement", note: "Acceptance criteria" },
      { key: "design", title: "Design", note: "Hardware and software" },
      { key: "test", title: "Test / evaluation", note: "Design against criteria" },
    ];
    const modelLinks = [
      ["intent", "requirement", "defines"],
      ["requirement", "design", "guides design"],
      ["requirement", "test", "acceptance criteria"],
      ["design", "test", "design under test"],
    ];
    const destinations = [
      ["Project", "folder"],
      ["Work", "waypoints"],
      ["Evaluations", "flask-conical"],
      ["Configurations", "layers"],
      ["Model", "workflow"],
    ];
    const esc = (text) =>
      String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const stored = window.openai?.widgetState?.privateContent;
    const saved = stored?.version === 2 ? stored.states : [];
    const states = Array.from(root.querySelectorAll(".tracer-study"), (el, index) => ({
      el,
      index,
      page: "Work",
      selected: "REQ-R03",
      view: "Graph",
      mode: "read",
      draft: currentDesign,
      dirty: false,
      configure: false,
      authoring: "Visual",
      modelLabel: "design under test",
      savedModelLabel: "design under test",
      modelSelection: "design",
      depth: 2,
      savedStatements: {},
      savedVersions: {},
      reviewDecision: "Needs reevaluation",
      reviewRationale: "",
      savedReview: null,
      message: "",
      ...saved[index],
    }));
    const persist = () => {
      if (!window.openai?.setWidgetState) return;
      window.openai
        .setWidgetState({
          modelContent: {
            design: "scope-first studio",
            states: states.map((s) => ({
              composition: s.el.dataset.composition,
              page: s.page,
              view: s.view,
              selected: s.selected,
              mode: s.mode,
            })),
          },
          privateContent: {
            version: 2,
            origin: writer,
            states: states.map(({ el, index, ...state }) => state),
          },
        })
        .catch(() => {});
    };
    const version = (state, record) => state.savedVersions[record.key] ?? record.version;
    const identity = (record, state) =>
      `<div class="detail-identity"><span class="key">${esc(record.key)}</span><h2>${esc(record.title)}</h2><p class="muted">${record.type} · current v${version(state, record)}</p></div>`;
    const recordButton = (record, state, classes = "node") =>
      `<button type="button" class="${classes} cursor-interaction" data-record="${record.key}" data-point="${record.key}" aria-pressed="${record.key === state.selected}"><strong class="key">${record.key} · v${version(state, record)}</strong><span class="node-title">${esc(record.title)}</span><span class="muted">${record.type}</span></button>`;
    function graph(state) {
      const shown =
        state.depth === 1 ? records.filter((record) => record.key !== "FIND-R02") : records;
      const wide = {
        "REQ-R03": [1, 2],
        "DES-01": [2, 1],
        "DES-04": [2, 3],
        "EVAL-R02": [3, 2],
        "FIND-R02": [4, 2],
      };
      const narrow = {
        "REQ-R03": [1, 1],
        "DES-01": [2, 1],
        "DES-04": [2, 2],
        "EVAL-R02": [1, 3],
        "FIND-R02": [2, 3],
      };
      const positions = state.el.clientWidth < 600 ? narrow : wide;
      return `<div class="graph" aria-label="Recorded energy trace"><svg class="graph-lines" aria-hidden="true"></svg><div class="graph-grid">${shown.map((record) => recordButton(record, state).replace("data-record=", `style="grid-column:${positions[record.key][0]};grid-row:${positions[record.key][1]}" data-record=`)).join("")}</div></div><p class="graph-note">${shown.length} example items · ${state.depth === 1 ? 6 : 7} recorded connections · ${state.depth} ${state.depth === 1 ? "hop" : "hops"} from REQ-R03 within this excerpt</p>`;
    }
    function lanes(state) {
      return `<div class="lanes" aria-label="Aligned energy trace">${[
        "Requirement",
        "Design",
        "Evaluation",
        "Finding",
      ]
        .map(
          (type) =>
            `<section class="lane"><h3>${type}</h3>${records
              .filter((record) => record.type === type && (state.depth > 1 || type !== "Finding"))
              .map(
                (record) =>
                  `<button type="button" class="lane-item cursor-interaction" data-record="${record.key}" aria-pressed="${state.selected === record.key}"><span class="key">${record.key} · v${version(state, record)}</span><p>${esc(state.savedStatements[record.key] ?? record.statement)}</p><span class="muted">${links
                    .filter(
                      (link) =>
                        (link[0] === record.key || link[1] === record.key) &&
                        (state.depth > 1 || !link.includes("FIND-R02")),
                    )
                    .map(
                      ([source, target, meaning]) =>
                        `${source === record.key ? "→" : "←"} ${meaning} ${source === record.key ? target : source}`,
                    )
                    .join("<br>")}</span></button>`,
              )
              .join("")}</section>`,
        )
        .join(
          "",
        )}</div><p class="graph-note">${state.depth === 1 ? "4 items / 6 recorded connections shown; Finding is one hop beyond this scope." : "5 items / 7 recorded connections shown."} Shared designs appear once.</p>`;
    }
    function neighbors(state, selected) {
      const adjacent = links.filter((link) => link[0] === selected.key || link[1] === selected.key);
      return `<section class="connected" aria-label="Connected items"><h3>Connected items</h3>${adjacent
        .map(([source, target, meaning]) => {
          const other = records.find(
            (record) => record.key === (source === selected.key ? target : source),
          );
          return `<button type="button" class="cursor-interaction" data-record="${other.key}" aria-label="Follow ${other.key}"><span class="key">${source === selected.key ? "→" : "←"} ${other.key}</span><span>${esc(other.title)}</span><span class="muted">${meaning}</span></button>`;
        })
        .join("")}</section>`;
    }
    function comparison(state) {
      return `<section class="comparison" aria-label="Captured input inspection"><span class="key">EVAL-R02 · captured input DES-01</span><h2 style="margin-top:8px">Blower-control firmware design</h2><p class="outcome">SIMULATED within old allocation; predates firmware edit</p><p class="muted">Captured configuration: Orbit R1 baseline build · BUILD-R01</p><p class="status">Inputs changed · Review ${esc(state.savedReview?.decision ?? "unreviewed")}</p><div class="diff"><div><h3>Captured v1</h3><p>${esc(originalDesign)}</p></div><div><h3>Current v${state.savedVersions["DES-01"] ?? 2}</h3><p>${esc(state.savedStatements["DES-01"] ?? currentDesign)}</p></div></div>${state.mode === "review" ? reviewForm(state) : `<div class="actions"><button type="button" class="cursor-interaction" data-action="current">View current item</button><button type="button" class="cursor-interaction" data-action="review">Review receipt</button></div>${state.savedReview ? `<p style="margin-top:12px">${esc(state.savedReview.rationale)}</p>` : ""}`}<details><summary>Other captured inputs · 4</summary><p>REQ-R03, DES-04, TGT-02 and BUILD-R01 retain their recorded input revisions.</p></details>${state.message ? `<p class="study-message" role="status">${esc(state.message)}</p>` : ""}</section>`;
    }
    function reviewForm(state) {
      return `<section class="draft" aria-label="Preview evidence review"><h3>Review this captured result</h3><label>Decision<select data-field="decision">${["Acknowledge changed inputs", "Needs reevaluation", "Accept with rationale"].map((decision) => `<option ${state.reviewDecision === decision ? "selected" : ""}>${decision}</option>`).join("")}</select></label><label>Rationale<textarea data-field="reviewRationale" aria-label="Review rationale" placeholder="Explain how the captured result applies to this change.">${esc(state.reviewRationale)}</textarea></label><div class="actions"><button class="primary cursor-interaction" data-action="save-review">Save preview review</button><button class="cursor-interaction" data-action="capture">Cancel</button></div></section>`;
    }
    function detail(state) {
      const selected = records.find((record) => record.key === state.selected) || records[0];
      if (["capture", "review"].includes(state.mode)) return comparison(state);
      if (state.mode === "edit")
        return `<section class="draft" aria-label="Preview item editing">${identity(selected, state)}<label>Statement<textarea data-field="draft" aria-label="Draft statement">${esc(state.draft)}</textarea></label><p class="status">${state.dirty ? "Unsaved draft" : "Editing current item"}</p><div class="actions"><button type="button" class="primary cursor-interaction" data-action="save-item">Save preview</button><button type="button" class="cursor-interaction" data-action="cancel-edit">Cancel</button></div></section>`;
      return `<section>${identity(selected, state)}${state.view === "Graph" || state.mobileInspection ? `<p class="read-body" style="margin-top:16px">${esc(state.savedStatements[selected.key] ?? selected.statement)}</p>` : ""}<div class="actions" style="margin-top:16px"><button type="button" class="cursor-interaction" data-action="edit">Edit item</button>${["DES-01", "EVAL-R02", "FIND-R02"].includes(selected.key) ? '<button type="button" class="cursor-interaction" data-action="capture">Captured evidence</button>' : ""}</div>${state.dirty ? '<p class="status">Retained unsaved draft</p>' : ""}</section>${neighbors(state, selected)}`;
    }
    function work(state) {
      const capture = ["capture", "review"].includes(state.mode);
      const mobileDetail = state.el.clientWidth < 600 && state.mobileInspection;
      const focusedCapture = capture || mobileDetail;
      const header = `<div class="page-head"><div><span class="muted">${capture ? "Captured baseline · EVAL-R02" : "Working scope · REQ-R03"}</span><h1>${state.mode === "review" ? "Review energy evaluation" : capture ? "Captured design comparison" : "Whole-product energy allocation"}</h1></div>${state.dirty ? '<span class="status">Unsaved item draft</span>' : ""}</div>`;
      const toolbar = `<div class="toolbar" aria-label="Scope representations">${["Graph", "Table"].map((view) => `<button type="button" class="cursor-interaction" data-view="${view}" aria-pressed="${state.view === view}">${view}</button>`).join("")}<label>Trace depth<select data-field="depth" aria-label="Trace depth"><option value="1" ${state.depth === 1 ? "selected" : ""}>1 level</option><option value="2" ${state.depth === 2 ? "selected" : ""}>2 levels</option></select></label></div>`;
      return `${header}${focusedCapture ? `<button class="quiet cursor-interaction" data-action="return">← Return to REQ-R03 scope</button><div class="focus-comparison">${detail(state)}</div>` : `${toolbar}<div class="work-split ${state.view === "Table" ? "is-table" : ""}"><div class="work-main">${state.view === "Graph" ? graph(state) : lanes(state)}</div><aside class="work-detail" aria-label="Selection inspector">${detail(state)}</aside></div>`}`;
    }
    function home() {
      return `<div class="page-head"><div><span class="muted">Fictional integrated product</span><h1>Orbit R1</h1></div></div><p>Hardware, firmware and product evidence in one connected project.</p><section class="saved-scopes"><h2>Working scopes</h2><button class="scope-entry cursor-interaction" data-action="begin"><span><strong>Review energy evidence after the firmware change</strong><span class="muted">REQ-R03 · shared hardware/software design · captured baseline</span></span><span aria-hidden="true">→</span></button></section>`;
    }
    function model(state) {
      const node = modelTypes.find((type) => type.key === state.modelSelection);
      const position = { intent: [1, 1], requirement: [2, 1], design: [3, 1], test: [4, 1] };
      const mobilePosition = { intent: [1, 1], requirement: [2, 1], design: [1, 2], test: [2, 2] };
      const positions = state.el.clientWidth < 600 ? mobilePosition : position;
      const flow = `<div class="model-flow" aria-label="Development workflow"><svg class="graph-lines" aria-hidden="true"></svg>${modelTypes.map((type) => `<button type="button" class="type-node cursor-interaction" data-model-type="${type.key}" data-point="${type.key}" aria-pressed="${type.key === state.modelSelection}" style="grid-column:${positions[type.key][0]};grid-row:${positions[type.key][1]}">${type.title}<span>${type.note}</span>${state.configure ? `<i class="port input ${type.key === "design" && state.el.clientWidth < 600 ? "top" : ""}" aria-hidden="true"></i><i class="port output" aria-hidden="true"></i>${type.key === "requirement" ? '<i class="port output bottom" aria-hidden="true"></i>' : type.key === "test" ? `<i class="port input ${state.el.clientWidth < 600 ? "top" : "bottom"}" aria-hidden="true"></i>` : ""}` : ""}</button>`).join("")}</div>`;
      const definitions = `<div class="definitions"><h2>Definitions</h2><p class="muted" style="margin:8px 0 18px">Same model draft as Visual</p><label>Design → evaluation label<input data-field="modelLabel" aria-label="Workflow connection label" value="${esc(state.modelLabel)}"></label><label>Exact definitions<textarea aria-label="Preview definitions" readonly>Intent → Requirement: defines
Requirement → Design: guides design
Requirement → Test: acceptance criteria
Design → Test: ${esc(state.modelLabel)}</textarea></label></div>`;
      return `<div class="page-head"><div><span class="muted">${state.configure ? "Model draft · starter example excerpt" : "Starter workflow · separate from Orbit item traces"}</span><h1>${state.configure ? "Configure model" : "Development model"}</h1></div><div class="actions">${state.configure ? '<button class="primary cursor-interaction" data-action="save-model">Save preview model</button><button class="cursor-interaction" data-action="cancel-model">Cancel</button>' : '<button class="cursor-interaction" data-action="configure">Configure model</button>'}</div></div><div class="toolbar">${state.configure ? ["Visual", "Text"].map((view) => `<button class="cursor-interaction" data-authoring="${view}" aria-pressed="${state.authoring === view}">${view}</button>`).join("") : '<span class="muted">Authored development flow</span>'}</div><div class="work-split"><div class="work-main">${state.configure && state.authoring === "Text" ? definitions : flow}<p class="graph-note">Requirements supply acceptance criteria. The design is the thing evaluated.</p></div><aside class="work-detail"><div><span class="muted">${state.configure ? "Selected connection" : "Selected type"}</span><h2>${state.configure ? "Design → evaluation" : node.title}</h2><p style="margin-top:12px">${state.configure ? "Edit the connection's label in one representation of the shared draft." : node.key === "design" ? "The design realizes requirements and becomes an input to an evaluation." : node.note}</p></div>${state.configure && state.authoring === "Visual" ? `<label>Connection label<input data-field="modelLabel" aria-label="Visual workflow connection label" value="${esc(state.modelLabel)}" style="width:100%;margin-top:8px"></label>` : !state.configure ? "<details><summary>Native connection meaning</summary><p>Requirement → Design: realized_by. Design → Test: tested_by. Workflow geometry does not reverse stored links.</p></details>" : ""}${state.message ? `<p class="study-message" role="status">${esc(state.message)}</p>` : ""}</aside></div>`;
    }
    function evaluations(state) {
      return `<div class="page-head"><h1>Evaluations</h1></div><button class="scope-entry cursor-interaction" data-action="evaluation"><span><strong>Simulated baseline energy evaluation</strong><span class="muted">EVAL-R02 · Orbit R1 baseline build</span></span><span class="status">Inputs changed</span></button><div class="focus-comparison" style="margin-top:18px">${state.mode === "review" ? detail(state) : comparison(state)}</div>`;
    }
    function configurations() {
      return `<div class="page-head"><div><span class="muted">BUILD-R01 · exact captured revisions</span><h1>Orbit R1 baseline build</h1></div></div><table class="membership"><thead><tr><th>Member</th><th>Pinned</th><th>Current</th></tr></thead><tbody><tr><td>DES-01<br><span class="muted">Blower-control firmware design</span></td><td>v1</td><td>v2 · changed</td></tr><tr><td>DES-04<br><span class="muted">Battery and power schematic</span></td><td>v1</td><td>v1</td></tr></tbody></table><p class="muted">Selected members shown; the captured configuration is immutable.</p><button class="cursor-interaction" style="margin-top:20px" data-page="Evaluations">View energy evaluation</button>`;
    }
    function render(state) {
      const page =
        state.page === "Project"
          ? home()
          : state.page === "Work"
            ? work(state)
            : state.page === "Model"
              ? model(state)
              : state.page === "Evaluations"
                ? evaluations(state)
                : configurations();
      state.el.innerHTML = `<aside class="rail"><div class="brand">Tracer</div><div class="project-id"><span class="key">Orbit R1</span><p class="muted">Engineering studio</p></div><nav aria-label="Project areas">${destinations.map(([name, icon]) => `<button type="button" class="cursor-interaction" data-page="${name}" aria-pressed="${state.page === name}"><i data-lucide="${icon}" aria-hidden="true"></i>${name}</button>`).join("")}</nav></aside><div class="content"><header class="app-header"><span class="location">Orbit R1 / ${state.page}</span>${state.dirty ? '<span class="status">Item draft retained</span>' : ""}</header><main class="page">${page}</main><footer class="footer">Design study · fictional example excerpt · all changes stay in this preview</footer></div>`;
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      requestAnimationFrame(() => draw(state));
    }
    function draw(state) {
      for (const diagram of state.el.querySelectorAll(".graph, .model-flow")) {
        const svg = diagram.querySelector(".graph-lines");
        const bounds = diagram.getBoundingClientRect();
        if (!bounds.width) continue;
        svg.setAttribute("viewBox", `0 0 ${bounds.width} ${bounds.height}`);
        const model = diagram.classList.contains("model-flow");
        const connections = model
          ? modelLinks.map((link) =>
              link[0] === "design" ? [link[0], link[1], state.modelLabel] : link,
            )
          : links;
        const marker = `arrow-${state.index}-${model ? "model" : "work"}`;
        svg.innerHTML =
          `<defs><marker id="${marker}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8"/></marker></defs>` +
          connections
            .map(([from, to, meaning], index) => {
              const a = diagram.querySelector(`[data-point="${from}"]`),
                b = diagram.querySelector(`[data-point="${to}"]`);
              if (!a || !b) return "";
              const ar = a.getBoundingClientRect(),
                br = b.getBoundingClientRect();
              if (model && from === "requirement" && (to === "test" || bounds.width < 500)) {
                const x1 = ar.x - bounds.x + ar.width / 2;
                const x2 = br.x - bounds.x + br.width / 2;
                const y1 = ar.bottom - bounds.y;
                const narrow = bounds.width < 500;
                const y2 = (narrow ? br.top : br.bottom) - bounds.y;
                const bend = narrow ? (y1 + y2) / 2 : Math.max(y1, y2) + 65;
                return `<path class="active" marker-end="url(#${marker})" d="M${x1} ${y1} V${bend} H${x2} V${y2}"/><text text-anchor="middle" x="${(x1 + x2) / 2}" y="${bend - 10 - (to === "test" && narrow ? 18 : 0)}">${esc(meaning)}</text>`;
              }
              const sameColumn = Math.abs(ar.x - br.x) < 10;
              if (sameColumn) {
                const down = br.y > ar.y;
                const x1 = ar.x - bounds.x + ar.width / 2;
                const x2 = br.x - bounds.x + br.width / 2;
                const y1 = (down ? ar.bottom : ar.top) - bounds.y;
                const y2 = (down ? br.top : br.bottom) - bounds.y;
                const bend = (y1 + y2) / 2;
                return `<path class="active" marker-end="url(#${marker})" d="M${x1} ${y1} C${x1} ${bend},${x2} ${bend},${x2} ${y2}"/>${model ? `<text x="${Math.min(bounds.width - 12, x1 + 10)}" y="${bend}" text-anchor="${x1 > bounds.width - 150 ? "end" : "start"}">${esc(meaning)}</text>` : ""}`;
              }
              const backwards = br.x < ar.x;
              const x1 = (backwards ? ar.left : ar.right) - bounds.x,
                y1 = ar.y - bounds.y + ar.height / 2;
              const x2 = (backwards ? br.right : br.left) - bounds.x,
                y2 = br.y - bounds.y + br.height / 2;
              const control = Math.max(18, Math.abs(x2 - x1) / 2),
                sign = backwards ? -1 : 1;
              const active = model || state.selected === from || state.selected === to;
              return `<path class="${active ? "active" : ""}" marker-end="url(#${marker})" d="M${x1} ${y1} C${x1 + control * sign} ${y1},${x2 - control * sign} ${y2},${x2} ${y2}"/>${active && (model || bounds.width > 550) ? `<text text-anchor="middle" x="${(x1 + x2) / 2}" y="${model ? ar.top - bounds.y - 12 : (y1 + y2) / 2 - 8 - (index % 2) * 14}">${esc(meaning)}</text>` : ""}`;
            })
            .join("");
      }
    }
    function act(state, event) {
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.record) {
        if (state.dirty && target.dataset.record !== state.selected) {
          state.message = "Draft retained. Save or cancel it before changing the inspected item.";
          const draft = state.el.querySelector(".draft");
          if (draft && !draft.querySelector("[role=status]"))
            draft.insertAdjacentHTML(
              "beforeend",
              `<p class="study-message" role="status">${state.message}</p>`,
            );
          return;
        }
        state.selected = target.dataset.record;
        state.mode = "read";
        state.mobileInspection = state.el.clientWidth < 600;
      }
      if (target.dataset.page) {
        state.page = target.dataset.page;
        state.message = "";
      }
      if (target.dataset.view) state.view = target.dataset.view;
      if (target.dataset.authoring) state.authoring = target.dataset.authoring;
      if (target.dataset.modelType) state.modelSelection = target.dataset.modelType;
      switch (target.dataset.action) {
        case "begin":
          state.page = "Work";
          break;
        case "edit":
          state.mode = "edit";
          if (!state.dirty)
            state.draft =
              state.savedStatements[state.selected] ??
              records.find((record) => record.key === state.selected).statement;
          break;
        case "save-item":
          state.savedStatements[state.selected] = state.draft;
          state.savedVersions[state.selected] =
            version(
              state,
              records.find((record) => record.key === state.selected),
            ) + 1;
          state.dirty = false;
          state.mode = "read";
          break;
        case "cancel-edit":
          state.dirty = false;
          state.mode = "read";
          break;
        case "capture":
          state.mode = "capture";
          break;
        case "evaluation":
          state.page = "Work";
          state.mode = "capture";
          break;
        case "current":
          if (state.dirty && state.selected !== "DES-01") {
            state.message =
              "Another item has an unsaved draft. Return to the scope to save or cancel it first.";
            break;
          }
          state.selected = "DES-01";
          state.mode = state.dirty ? "edit" : "read";
          state.page = "Work";
          break;
        case "return":
          state.mode = state.dirty ? "edit" : "read";
          state.mobileInspection = false;
          break;
        case "review":
          state.mode = "review";
          break;
        case "save-review":
          if (!state.reviewRationale.trim()) {
            state.message = "Add a rationale before saving this preview review.";
            break;
          }
          state.savedReview = { decision: state.reviewDecision, rationale: state.reviewRationale };
          state.mode = "capture";
          state.message = "Preview review saved. The captured outcome is unchanged.";
          break;
        case "configure":
          state.configure = true;
          state.message = "";
          break;
        case "save-model":
          state.configure = false;
          state.savedModelLabel = state.modelLabel;
          state.message = "Preview model saved.";
          break;
        case "cancel-model":
          state.configure = false;
          state.modelLabel = state.savedModelLabel;
          state.message = "";
          break;
      }
      render(state);
      persist();
    }
    for (const state of states) {
      render(state);
      state.el.addEventListener("click", (event) => act(state, event));
      state.el.addEventListener("input", (event) => {
        const field = event.target.dataset.field;
        if (!["draft", "modelLabel", "reviewRationale"].includes(field)) return;
        if (field === "draft") {
          state.draft = event.target.value;
          state.dirty = true;
          state.el.querySelector(".draft .status").textContent = "Unsaved draft";
        }
        if (field === "reviewRationale") state.reviewRationale = event.target.value;
        if (field === "modelLabel") {
          state.modelLabel = event.target.value;
          state.el.querySelectorAll('[data-field="modelLabel"]').forEach((input) => {
            if (input !== event.target) input.value = state.modelLabel;
          });
          const definition = state.el.querySelector('[aria-label="Preview definitions"]');
          if (definition)
            definition.value = `Intent → Requirement: defines\nRequirement → Design: guides design\nRequirement → Test: acceptance criteria\nDesign → Test: ${state.modelLabel}`;
          draw(state);
        }
        persist();
      });
      state.el.addEventListener("change", (event) => {
        if (event.target.dataset.field === "decision") {
          state.reviewDecision = event.target.value;
          persist();
        }
        if (event.target.dataset.field === "depth") {
          state.depth = Number(event.target.value);
          render(state);
          persist();
        }
      });
      new ResizeObserver(() => {
        if (state.el.clientWidth && state.lastNarrow !== state.el.clientWidth < 600) {
          state.lastNarrow = state.el.clientWidth < 600;
          render(state);
        } else draw(state);
      }).observe(state.el);
    }
    window.addEventListener("openai:set_globals", (event) => {
      const stored = event.detail?.globals?.widgetState?.privateContent;
      if (stored?.version !== 2 || stored.origin === writer) return;
      const data = stored.states;
      states.forEach((state, index) => {
        if (data[index]) {
          Object.assign(state, data[index]);
          render(state);
        }
      });
    });
    if (globalThis.Tweak) {
      for (const state of states) {
        const choices = {
          detail: state.el.dataset.composition === "docked" ? "Docked" : "Focused",
        };
        const tweak = new Tweak({
          container: state.el,
          onChange: () => {
            state.el.dataset.composition = choices.detail === "Docked" ? "docked" : "focused";
            render(state);
          },
        });
        tweak.addSelect(choices, "detail", {
          label: "Inspection composition",
          options: ["Docked", "Focused"],
        });
      }
    }
  })();
</script>
