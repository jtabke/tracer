</style>
<script>
  (() => {
    const root = document.getElementById("tracer-journey-studio"),
      app = root.querySelector(".js-app");
    const fixtures = JSON.parse(document.getElementById("tracer-journey-fixtures").textContent);
    const origin = crypto.randomUUID(),
      restored = window.openai?.widgetState?.privateContent;
    const state = {
      project: "medical",
      page: "Project",
      root: "SYS-07",
      selected: "SYS-07",
      view: "Table",
      depth: 1,
      relationshipScope: "Engineering trace",
      customRelationships: [],
      mode: "read",
      search: "",
      pageIndex: 0,
      created: [],
      connections: [],
      edits: {},
      reviews: {},
      draft: null,
      link: null,
      fault: "Normal",
      message: "",
      camera: null,
      modelType: "",
      ...(restored?.version === 1 ? restored.state : {}),
    };
    let gesture = null;
    const esc = (value) =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    const human = (value) => String(value).replaceAll("_", " ");
    const current = () => fixtures[state.project];
    const records = () =>
      current()
        .records.filter((r) => state.project !== "medical" || r.id !== "CMP-06")
        .concat(state.created.filter((r) => r.project === state.project))
        .map((r) => ({ ...r, ...state.edits[`${state.project}:${r.id}`] }));
    const record = (id) => records().find((r) => r.id === id);
    const links = () =>
      current()
        .links.filter(
          (l) => state.project !== "medical" || (l.source !== "CMP-06" && l.target !== "CMP-06"),
        )
        .concat(state.connections.filter((l) => l.project === state.project));
    const receipt = (id) => current().receipts.find((r) => r.id === id);
    const dirty = () => !!state.draft || !!state.link || !!state.reviewDraft;
    const persist = () => {
      if (!window.openai?.setWidgetState) return;
      const snapshot = { version: 1, origin, state: structuredClone(state) };
      if (JSON.stringify(snapshot).length > 15500) return;
      window.openai
        .setWidgetState({
          modelContent: {
            project: state.project,
            page: state.page,
            scope: state.root,
            selection: state.selected,
            representation: state.view,
            inspection: state.mode,
            fault: state.fault,
          },
          privateContent: snapshot,
        })
        .catch(() => {});
    };
    function scope() {
      const all = records(),
        edges = links().filter((l) => activeRelationships().includes(l.type)),
        found = new Set([state.root]),
        frontier = [state.root];
      for (let level = 0; level < state.depth; level++) {
        const next = [];
        for (const id of frontier.splice(0)) {
          for (const l of edges) {
            const other = l.source === id ? l.target : l.target === id ? l.source : null;
            if (other && !found.has(other)) {
              found.add(other);
              next.push(other);
            }
          }
        }
        frontier.push(...next);
      }
      const nodes = all.filter((r) => found.has(r.id));
      return { nodes, links: edges.filter((l) => found.has(l.source) && found.has(l.target)) };
    }
    function activeRelationships() {
      if (state.relationshipScope === "All connections")
        return Object.keys(current().schema.relationshipTypes);
      if (state.relationshipScope === "Custom connections") return state.customRelationships;
      return {
        medical: [
          "decomposes_into",
          "realized_by",
          "verified_by",
          "validated_by",
          "executed_as",
          "depends_on",
        ],
        technology: [
          "breaks_down_into",
          "implemented_by",
          "checked_by",
          "exercised_as",
          "changes",
          "provides",
          "consumes",
          "depends_on",
        ],
        integrated: [
          "breaks_down_into",
          "realized_by",
          "defines",
          "provides",
          "consumes",
          "depends_on",
          "evaluated_by",
        ],
      }[state.project];
    }
    function identity(r) {
      return `<div class="identity"><span class="key">${esc(r.key)}</span><h2>${esc(r.title)}</h2><p class="muted">${human(r.type)} · current v${r.version}</p></div>`;
    }
    function blocked() {
      if (!dirty()) return false;
      state.message =
        "Your unsaved draft is retained. Save or cancel it before changing the inspected item or scope.";
      render();
      return true;
    }
    function choose(id, asScope = false) {
      if (dirty()) {
        if (id === state.selected && !asScope) return;
        if (blocked()) return;
      }
      state.selected = id;
      state.mode = "read";
      state.mobileDetail = root.clientWidth < 600;
      if (asScope) {
        state.root = id;
        state.page = "Work";
        state.camera = null;
        state.mobileDetail = false;
        if (record(id).type === "change_assessment") state.relationshipScope = "All connections";
      } else if (state.view === "Graph") center(id);
      state.message = "";
      render();
    }
    function top(title, subtitle = "", actions = "") {
      return `<div class="page-head"><div>${subtitle ? `<span class="muted">${esc(subtitle)}</span>` : ""}<h1>${esc(title)}</h1></div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;

    function points(data) {
      const distance = new Map([[state.root, 0]]),
        sides = new Map([[state.root, 0]]),
        queue = [state.root];

        for (const l of data.links) {
          const other = l.source === id ? l.target : l.target === id ? l.source : null;
          if (other && !distance.has(other)) {
            distance.set(other, distance.get(id) + 1);

            queue.push(other);

        const col = (distance.get(r.id) || 0) * (sides.get(r.id) || 0);
        columns.set(col, [...(columns.get(col) || []), r.id]);
      }
      const result = {};
      for (const [column, ids] of columns)
        ids.sort().forEach((id, index) => {
          result[id] = { x: column * 194, y: (index - (ids.length - 1) / 2) * 140 };

    function fit(data, viewport) {

        minY = Math.min(...p.map((p) => p.y)),
        maxY = Math.max(...p.map((p) => p.y)) + 110;

        1,
        (viewport.clientWidth - 32) / (maxX - minX),
        (viewport.clientHeight - 32) / (maxY - minY),

        x: viewport.clientWidth / 2 - ((minX + maxX) * scale) / 2,
        y: viewport.clientHeight / 2 - ((minY + maxY) * scale) / 2,

      persist();
    });
    root.addEventListener("input", (event) => {
      if (event.composedPath().some((node) => node.classList?.contains("full-model"))) return;
      const field = event.target.dataset.input,
        value = event.target.value;
      if (!field) return;
      if (field === "search") {
        state.search = value;
        state.pageIndex = 0;
        root.querySelector(".library-results").innerHTML = resultRows();
      } else if (field.startsWith("draft-")) state.draft[field.slice(6)] = value;
      else if (field.startsWith("extra:")) state.draft.fields[field.slice(6)] = value;
      else if (field === "link-scope") state.link.scope = value;
      else if (field === "link-review") state.link.review = value;
      else if (field === "review-rationale") state.reviewDraft.rationale = value;
      else if (field === "candidate") {
        state.candidateSearch = value;
        const rows = records().filter(
          (r) =>
            r.id !== state.link.source &&
            eligible(state.link.type, r.id) &&
            [r.key, r.title, r.statement].join(" ").toLowerCase().includes(value.toLowerCase()),
        );
        root.querySelector(".candidate-results").innerHTML = candidateRows(rows);
      }
      persist();
    });
    root.addEventListener("change", (event) => {
      if (event.composedPath().some((node) => node.classList?.contains("full-model"))) return;
      const field = event.target.dataset.change,
        value = event.target.value;
      if (!field) return;
      if (field === "project") {
        if (blocked()) return;
        state.project = value;
        state.root = current().tasks[0].root;
        state.selected = state.root;
        state.page = "Project";
        state.mode = "read";
        state.modelType = "";
        state.configuration = "";
        state.camera = null;
        state.capture = null;
      }
      if (field === "depth") {
        state.depth = Number(value);
        state.camera = null;
      }
      if (field === "relationship-scope") {
        if (value === "Custom connections" && !state.customRelationships.length)
          state.customRelationships = activeRelationships();
        state.relationshipScope = value;
        state.camera = null;
      }
      if (field === "relationship-choice") {
        state.customRelationships = event.target.checked
          ? [...new Set([...state.customRelationships, value])]
          : state.customRelationships.filter((type) => type !== value);
        state.camera = null;
      }
      if (field === "draft-type") {
        state.draft.type = value;
        state.draft.fields = {};
      }
      if (field === "link-type") {
        state.link.type = value;
        state.link.target = null;
        state.mode = "connect";
      }
      if (field === "review-decision") state.reviewDraft.decision = value;
      if (field === "matrix-kind") state.matrixKind = value;
      if (field === "trace-recipe") state.traceRecipe = Number(value);
      render();
      persist();
    });
    root.addEventListener("pointerdown", (event) => {
      const viewport = event.target.closest(".graph-viewport");
      if (!viewport || event.target.closest("button")) return;
      gesture = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        camera: { ...state.camera },
      };
      viewport.setPointerCapture(event.pointerId);
    });
    root.addEventListener("pointermove", (event) => {
      if (!gesture || gesture.id !== event.pointerId) return;
      state.camera = {
        ...gesture.camera,
        x: gesture.camera.x + event.clientX - gesture.x,
        y: gesture.camera.y + event.clientY - gesture.y,
      };
      drawGraph();
    });
    root.addEventListener("pointerup", (event) => {
      if (!gesture || gesture.id !== event.pointerId) return;
      gesture = null;
      persist();
    });
    window.addEventListener("openai:set_globals", (event) => {
      const stored = event.detail?.globals?.widgetState?.privateContent;
      if (stored?.version === 1 && stored.origin !== origin) {
        Object.assign(state, stored.state);
        render();
      }
    });
    render();
    new ResizeObserver(() => {
      if (root.querySelector(".graph-viewport")) drawGraph();
    }).observe(root);
    if (globalThis.Tweak) {
      const settings = { condition: "Normal" };
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          state.fault = settings.condition;
          state.message = "";
          render();
        },
      });
      tweak.addSelect(settings, "condition", {
        label: "Rehearsal condition",
        options: ["Normal", "Read unavailable", "Save conflict", "Unavailable input"],
      });
    }
  })();
</script>
