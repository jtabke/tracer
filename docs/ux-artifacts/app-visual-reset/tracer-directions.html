<script>

        /[&<>"']/g,
        (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
      );
    const pretty = (value) => value.replaceAll("_", " ").replace(/\b\w/g, (c) => c.toUpperCase());

          name,
          {
            page: state.page,
            mode: state.mode,
            type: state.type,
            scope: state.scope,
            selected: state.selected,
            query: state.query,
            filter: state.filter,
          },
        ]),
      );
      window.openai
        ?.setWidgetState?.({
          modelContent: { studio: choices.studio, focus: choices.focus },
          privateContent: choices,
        })
        ?.catch(() => {});
    };
    function home() {
      const goals = data.records

      return `<div class="page-heading"><div><div class="overline">PRODUCT DEVELOPMENT</div><h1>Orbit R1</h1><p class="lede">A connected view of the product’s intent, engineering decisions and evidence.</p></div><button class="primary cursor-interaction" data-scope="control">Open control workspace ${icon("arrow-up-right")}</button></div><div class="home-layout"><section><h2>Product intent</h2>${goals.map((value) => `<button class="outline-row cursor-interaction" data-scope="intent" data-goal="${value.key}"><div><span class="key outline-key">${escape(value.key)}</span><div><strong>${escape(value.title)}</strong><small>${escape(value.statement)}</small></div></div>${icon("chevron-right")}</button>`).join("")}<div class="section-rule"><h2>Explore the design</h2><button class="outline-row cursor-interaction" data-scope="control"><div>${icon("git-fork")}<div><strong>Shared control responsibilities</strong><small>Five requirements connect to the same control design.</small></div></div>${icon("arrow-up-right")}</button><button class="outline-row cursor-interaction" data-page="builds"><div>${icon("layers")}<div><strong>Recorded configurations</strong><small>Compare the starting build with hardware v1 and firmware v2.</small></div></div>${icon("arrow-up-right")}</button></div></section><aside><section><h2>A change to investigate</h2><div class="spotlight"><span class="key">DES-01 · v2</span><strong>Blower-control firmware</strong><p>The proposed duty-profile change intersects energy, thermal, timing and acoustic requirements.</p><button class="quiet cursor-interaction" data-scope="change">Explore the connected records ${icon("arrow-right")}</button></div></section><section><h2>Recorded evidence</h2><div class="spotlight"><span class="tag attention">3 input sets changed</span><strong>Earlier results retain firmware v1</strong><p>Review the captured inputs and outcome in context. Current drift is separate from the result.</p><button class="quiet cursor-interaction" data-page="evidence">Open evaluations ${icon("arrow-right")}</button></div></section></aside></div><div class="home-summary"><span>72 items</span><span>170 recorded connections</span><span>Fictional engineering example</span></div>`;

      return `<div class="page-heading"><div><div class="overline">ORBIT R1 / DESIGN</div><h1>${title}</h1><p class="lede">${subtitle}</p></div><button class="quiet cursor-interaction" data-page="home">${icon("arrow-left")} Project</button></div><div class="work-toolbar"><div class="mode-switch"><button data-mode="table" class="cursor-interaction ${state.mode === "table" ? "is-active" : ""}">${icon("table-2")} Table</button><button data-mode="graph" class="cursor-interaction ${state.mode === "graph" ? "is-active" : ""}">${icon("network")} Graph</button></div><button class="quiet cursor-interaction" data-action="statements" aria-pressed="${state.statements}">Full statements</button><span class="work-meta">${state.mode === "table" ? (state.scope === "control" ? "5 loaded responsibilities · current records" : "Recorded trace · current records") : "Focused record · explicit recorded connections"}</span></div><div class="workspace-grid ${state.selected ? "has-peek" : ""}"><section>${state.mode === "table" ? (state.scope === "intent" ? intentTable(state) : state.scope === "change" ? changeTable(state) : traceTable(state)) : traceGraph(state)}</section>${state.selected ? peek(state) : ""}</div>`;
    }
    function traceTable(state) {
      return `<div class="table-wrap"><table><thead><tr><th>Requirement</th><th>Realized by</th><th>Evaluated by</th></tr></thead><tbody>${members()

    }
    function intentTable(state) {
      const goals = data.records.filter(
        (r) => r.type === "goal" && (!state.intentRoot || r.key === state.intentRoot),

        data.links
          .filter((l) => l.source === goal.key && l.type === "breaks_down_into")

            data.links
              .filter((next) => next.source === l.target && next.type === "breaks_down_into")

          ),
      );
      const cell = (r) =>
        `<td class="title-cell"><button class="cursor-interaction" data-item="${r.key}"><span><span class="key">${r.key} · v${r.version}</span><span class="item-title">${escape(r.title)}</span>${state.statements ? `<span class="row-statement">${escape(r.statement)}</span>` : ""}</span></button></td>`;
      return `<div class="table-wrap"><table><thead><tr><th>Goal</th><th>Target · breaks down into</th><th>Function · breaks down into</th></tr></thead><tbody>${paths.map((path) => `<tr>${path.map(cell).join("")}</tr>`).join("")}</tbody></table></div><p class="table-note">${paths.length} recorded paths · repeated keys retain shared identity.</p>`;
    }
    function changeTable(state) {
      const links = data.links.filter(
        (l) => l.source === "CHG-R01" && l.type === "assessment_references",
      );
      return `<div class="table-wrap"><table><thead><tr><th>Review subject</th><th>Type</th><th>Version</th></tr></thead><tbody>${links
        .map((l) => {
          const r = record(l.target);

        })
        .join(
          "",
        )}</tbody></table></div><p class="table-note">${links.length} explicit assessment references. A reference does not establish an engineering consequence.</p>`;
    }
    function traceGraph(state) {
      const center = record(state.graphRoot);
      const incoming = data.links
        .filter((l) => l.target === center.key && l.type === "breaks_down_into")
        .slice(0, 3);
      const meanings =
        state.scope === "intent"
          ? ["breaks_down_into"]
          : state.scope === "change"
            ? ["assessment_references"]
            : ["realized_by", "evaluated_by"];
      const outgoing = data.links.filter(
        (l) => l.source === center.key && meanings.includes(l.type),
      );
      const node = (key, side, meaning) => {
        const r = record(key);
        return `<button class="graph-node cursor-interaction ${state.selected === key ? "is-active" : ""}" data-item="${key}" data-node="${key}" data-side="${side}"><small>${pretty(r.type)}</small><span class="key">${r.key} · v${r.version}</span><strong>${escape(r.title)}</strong>${meaning ? `<span class="graph-edge-label">${escape(meaning.replaceAll("_", " "))}</span>` : ""}</button>`;
      };
      return `<div class="graph-stage" aria-label="Recorded connections for ${center.key}"><svg aria-hidden="true"></svg><div class="graph-column">${incoming.map((l) => node(l.source, "incoming", l.type)).join("")}</div><div class="graph-column center">${node(center.key, "center", "")}</div><div class="graph-column">${outgoing.map((l) => node(l.target, "outgoing", l.type)).join("")}</div></div><p class="table-note">${center.key} · explicit selected relationship types in this focused trace.</p>`;
    }
    function peek(state) {
      const r = record(state.selected),
        receipt = data.evidence.find((e) => e.output === r.key),
        related = data.links.filter(
          (l) => l.source === r.key && ["realized_by", "evaluated_by"].includes(l.type),
        );
      return `<aside class="peek" aria-label="Selected record"><div class="peek-head"><div><div class="overline">${pretty(r.type)} · v${r.version}</div><h2>${escape(r.title)}</h2><span class="key">${r.key}</span></div><button class="quiet cursor-interaction" aria-label="Close detail" data-action="close">${icon("x")}<span class="mobile-return">Back to ${state.page === "work" ? state.mode : state.page === "evidence" ? "evaluations" : "items"}</span></button></div>${state.editing ? `<div class="editing-status">Unsaved preview · native capture would check v${r.version}</div><label>Statement<textarea data-draft maxlength="4000">${escape(state.draft)}</textarea></label><div class="edit-actions"><button class="primary cursor-interaction" data-action="preview-save">Save preview</button><button class="quiet cursor-interaction" data-action="cancel">Cancel</button></div>` : `<p class="statement">${escape(state.previews?.[r.key] ?? r.statement)}</p><button class="quiet cursor-interaction" data-action="edit">${icon("pencil")} Edit statement</button>`}<div class="detail-rule"><h3>Connected context</h3>${related.length ? related.map((l) => `<button class="outline-row cursor-interaction" data-item="${l.target}"><div><span class="key">${l.target}</span><small>${escape(l.type.replaceAll("_", " "))}</small></div>${icon("chevron-right")}</button>`).join("") : "<small>Explore its recorded relationships in Graph.</small>"}</div>${receipt ? `<div class="detail-rule"><h3>Recorded evaluation</h3><div class="receipt-preview"><span class="tag ${receipt.drift === "Changed inputs" ? "attention" : ""}">${receipt.drift}</span><p>${escape(receipt.outcome)}</p>${receipt.inputs.map((i) => `<div><span class="key">${i.key}</span> <small>captured v${i.recorded} → current v${i.current}</small></div>`).join("")}</div></div>` : ""}</aside>`;
    }
    function items(state) {
      const rows = data.records
        .filter(
          (r) =>
            (!state.query ||
              `${r.key} ${r.title} ${r.type}`.toLowerCase().includes(state.query.toLowerCase())) &&
            (!state.filter || r.type === state.filter),
        )
        .sort((a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }));
      return `<div class="page-heading"><div><div class="overline">ORBIT R1</div><h1>All items</h1><p class="lede">One searchable collection, with the same records available in their connected contexts.</p></div></div><div class="search-bar"><input aria-label="Find an item" maxlength="200" data-search placeholder="Find a key, title or type" value="${escape(state.query)}"><select aria-label="Item type" data-filter><option value="">All types</option>${Object.keys(
        data.schema.entityTypes,
      )
        .map(
          (t) =>
            `<option value="${t}" ${state.filter === t ? "selected" : ""}>${pretty(t)}</option>`,
        )
        .join(
          "",
        )}</select><small>${rows.length} matching</small></div><div class="workspace-grid ${state.selected ? "has-peek" : ""}"><div class="record-grid">${rows
        .slice(0, 12)
        .map(
          (r) =>
            `<button class="cursor-interaction" data-item="${r.key}"><span class="record-title"><span class="key">${r.key} · v${r.version}</span><strong>${escape(r.title)}</strong></span><span class="tag">${pretty(r.type)}</span></button>`,
        )
        .join(
          "",
        )}<small>First ${Math.min(12, rows.length)} matching records in this design study</small></div>${state.selected ? peek(state) : ""}</div>`;
    }
    function model(state) {
      const type = state.type,
        definition = data.schema.entityTypes[type],
        count = data.records.filter((r) => r.type === type).length;
      const incoming = Object.entries(data.schema.relationshipTypes).filter(([, r]) =>
        r.target?.includes(type),
      );
      const outgoing = Object.entries(data.schema.relationshipTypes).filter(([, r]) =>
        r.source?.includes(type),
      );
      const group = (name, types) =>
        `<div class="connection-group"><small>${escape(name.replaceAll("_", " "))}</small>${types.map((t) => `<button class="cursor-interaction" data-type="${t}">${pretty(t)}</button>`).join("")}</div>`;
      return `<div class="page-heading"><div><div class="overline">PROJECT SETTINGS</div><h1>Project model</h1><p class="lede">Understand the types and connections this project allows, one type at a time.</p></div></div><div class="model-layout"><nav class="type-list" aria-label="Project types">${Object.keys(
        data.schema.entityTypes,
      )
        .map(
          (t) =>
            `<button class="cursor-interaction ${t === type ? "is-active" : ""}" data-type="${t}">${pretty(t)}</button>`,
        )
        .join(
          "",
        )}</nav><section class="type-lens"><div class="model-labels"><span>Allowed sources</span><span>Allowed targets</span></div><div class="model-direction"><div class="model-source">${incoming.map(([n, r]) => group(n, r.source)).join("") || "<small>No declared incoming types</small>"}</div><div class="model-arrow" aria-hidden="true">→</div><div class="type-focus"><small>Selected type</small><h2>${pretty(type)}</h2><small>${count} active records · ${Object.keys(definition.fields).length} fields</small><button class="quiet cursor-interaction" data-browse-type="${type}">Browse records ${icon("arrow-up-right")}</button></div><div class="model-arrow" aria-hidden="true">→</div><div class="model-target">${outgoing.map(([n, r]) => group(n, r.target)).join("") || "<small>No declared outgoing types</small>"}</div></div><p class="model-caption">Allowed connections describe the model. Recorded item links and their evidence belong in the workspace.</p><details class="section-rule"><summary>Fields for ${pretty(type)}</summary><div class="pin-list">${Object.entries(
        definition.fields,
      )
        .map(
          ([name, f]) =>
            `<span>${pretty(name)} · ${f.type}${f.required ? " · required" : ""}</span>`,
        )
        .join("")}</div></details></section></div>`;
    }
    function evidence(state) {
      return `<div class="page-heading"><div><div class="overline">ORBIT R1</div><h1>Evaluations</h1><p class="lede">Read the result, its captured input set and what has changed since.</p></div></div><div class="workspace-grid ${state.selected ? "has-peek" : ""}"><section>${data.evidence.map((e) => `<button class="evidence-row cursor-interaction" data-item="${e.output}"><span class="key">${e.output}</span><span><strong>${escape(record(e.output).title)}</strong><small>${escape(e.outcome)}</small></span><span class="tag ${e.drift === "Changed inputs" ? "attention" : ""}">${e.drift}</span></button>`).join("")}<p class="table-note">Four recorded receipts. Acoustic and schedule evaluation definitions have no recorded receipt.</p></section>${state.selected ? peek(state) : ""}</div>`;
    }
    function builds() {
      return `<div class="page-heading"><div><div class="overline">ORBIT R1</div><h1>Configurations</h1><p class="lede">The exact native revisions selected for a build or proposal.</p></div></div>${data.configurations.map((c) => `<section class="configuration-row"><div class="configuration-head"><div><span class="key">${escape(c.subject)}</span><h2>${escape(c.name)}</h2></div><span class="tag">${c.members.length} pinned members</span></div><p>${escape(c.reason)}</p><div class="pin-list">${c.members.map((p) => `<span>${p.key} · v${p.version}</span>`).join("")}</div></section>`).join("")}`;
    }
    function drawGraph(win) {
      const stage = win.querySelector(".graph-stage");
      if (!stage) return;
      const svg = stage.querySelector("svg"),
        box = stage.getBoundingClientRect(),
        center = stage.querySelector('[data-side="center"]').getBoundingClientRect();
      if (box.width < 1 || box.height < 1) return;
      svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
      svg.innerHTML = [...stage.querySelectorAll("[data-side]")]
        .filter((n) => n.dataset.side !== "center")
        .map((n) => {
          const b = n.getBoundingClientRect(),
            incoming = n.dataset.side === "incoming",
            sx = (incoming ? b.right : center.right) - box.left,
            sy = (incoming ? b.top + b.height / 2 : center.top + center.height / 2) - box.top,
            tx = (incoming ? center.left : b.left) - box.left,
            ty = (incoming ? center.top + center.height / 2 : b.top + b.height / 2) - box.top,
            mx = (sx + tx) / 2;
          return `<path d="M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}" fill="none" stroke="#657d75" stroke-width="1.5"/><path d="M${tx - 5},${ty - 4} L${tx},${ty} L${tx - 5},${ty + 4}" fill="none" stroke="#657d75" stroke-width="1.5"/>`;
        })
        .join("");
    }
    function render(win, state) {
      win
        .querySelectorAll("[data-page]")
        .forEach((b) => b.classList.toggle("is-active", b.dataset.page === state.page));
      win
        .querySelectorAll("[data-scope]")
        .forEach((b) =>
          b.classList.toggle("is-active", state.page === "work" && b.dataset.scope === state.scope),
        );
      const crumb = win.querySelector("[data-breadcrumb]");
      if (crumb)
        crumb.textContent =
          state.page === "work"
            ? "Shared control"
            : pretty(state.page === "home" ? "project" : state.page);
      win.querySelector(".page-stage").innerHTML = {
        home: () => home(),
        work: () => work(state),
        items: () => items(state),
        model: () => model(state),
        evidence: () => evidence(state),
        builds: () => builds(),
      }[state.page]();
      globalThis.lucide?.createIcons?.({ attrs: { width: 16, height: 16 } });
      requestAnimationFrame(() => drawGraph(win));
    }
    windows.forEach((win) => {
      const name = win.dataset.design;
      const persisted = stored[name] ?? {};
      const state = (states[name] = {
        page: ["home", "work", "items", "model", "evidence", "builds"].includes(persisted.page)
          ? persisted.page
          : "home",
        scope: "control",
        mode: persisted.mode === "graph" ? "graph" : "table",
        statements: name === "focus",
        intentRoot: null,
        selected: null,
        graphRoot: "REQ-R03",
        type: "requirement",
        query: "",
        filter: "",
        editing: false,
        draft: "",
        previews: {},
        drafts: {},
      });
      render(win, state);
      win.addEventListener("click", (event) => {
        const b = event.target.closest("button");
        if (!b) return;
        if (b.dataset.page) {
          if (state.editing) state.drafts[state.selected] = state.draft;
          state.page = b.dataset.page;
          state.selected = null;
          state.editing = false;
        }
        if (b.dataset.scope) {
          if (state.editing) state.drafts[state.selected] = state.draft;
          state.page = "work";
          state.scope = b.dataset.scope;
          state.intentRoot = b.dataset.goal ?? null;
          state.graphRoot =
            b.dataset.scope === "change"
              ? "CHG-R01"
              : b.dataset.scope === "intent"
                ? (data.links.find(
                    (l) => l.type === "breaks_down_into" && l.source === state.intentRoot,
                  )?.target ?? "TGT-02")
                : "REQ-R03";
          state.selected = null;
          state.editing = false;
        }
        if (b.dataset.mode) state.mode = b.dataset.mode;
        if (b.dataset.item) {
          if (
            state.editing &&
            state.draft !== record(state.selected).statement &&
            !window.confirm("Discard the unsaved preview?")
          )
            return;
          state.selected = b.dataset.item;
          state.editing = Object.hasOwn(state.drafts, state.selected);
          state.draft = state.drafts[state.selected] ?? "";
        }
        if (b.dataset.type) state.type = b.dataset.type;
        if (b.dataset.browseType) {
          state.page = "items";
          state.filter = b.dataset.browseType;
          state.selected = null;
        }
        if (b.dataset.action === "close") {
          if (state.editing && !window.confirm("Discard the unsaved preview?")) return;
          state.selected = null;
          state.editing = false;
        }
        if (b.dataset.action === "edit") {
          state.editing = true;
          state.draft = state.previews[state.selected] ?? record(state.selected).statement;
        }
        if (b.dataset.action === "statements") state.statements = !state.statements;
        if (b.dataset.action === "cancel") {
          state.editing = false;
          delete state.drafts[state.selected];
        }
        if (b.dataset.action === "preview-save") {
          state.previews[state.selected] = state.draft;
          delete state.drafts[state.selected];
          state.editing = false;
        }
        render(win, state);
        save();
      });
      win.addEventListener("input", (event) => {
        if (event.target.hasAttribute("data-draft")) state.draft = event.target.value;
        if (event.target.hasAttribute("data-search")) {
          state.query = event.target.value;
          const pos = event.target.selectionStart;
          render(win, state);
          const input = win.querySelector("[data-search]");
          input.focus();
          input.setSelectionRange(pos, pos);
        }
      });
      win.addEventListener("change", (event) => {
        if (event.target.hasAttribute("data-filter")) {
          state.filter = event.target.value;
          render(win, state);
          save();
        }
      });
      const resize = new ResizeObserver(() => drawGraph(win));
      resize.observe(win);
      if (globalThis.Tweak) {
        const options = { typeSize: 14, density: "Comfortable", detailWidth: 360 };
        const tweak = new Tweak({
          container: win,
          onChange: () => {
            win.style.setProperty("--copy-size", `${options.typeSize}px`);
            win.style.setProperty("--row-space", options.density === "Compact" ? "12px" : "17px");
            win.style.setProperty("--peek-width", `${options.detailWidth}px`);
            drawGraph(win);
          },
        });
        tweak.addSlider(options, "typeSize", {
          label: "Reading size",
          min: 13,
          max: 16,
          unit: "px",
        });
        tweak.addSelect(options, "density", {
          label: "Row density",
          options: ["Comfortable", "Compact"],
        });
        tweak.addSlider(options, "detailWidth", {
          label: "Detail width",
          min: 320,
          max: 440,
          step: 20,
          unit: "px",
        });
      }
    });
    window.addEventListener("openai:set_globals", (event) => {
      const next = event.detail?.globals?.widgetState?.privateContent;
      if (!next) return;
      windows.forEach((win) => {
        const state = states[win.dataset.design],
          value = next[win.dataset.design];
        if (!value) return;
        if (["home", "work", "items", "model", "evidence", "builds"].includes(value.page))
          state.page = value.page;
        if (["table", "graph"].includes(value.mode)) state.mode = value.mode;
        render(win, state);
      });
    });
  })();
</script>
