<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img"><title>A  Coverage grid</title><desc>Compare several requirements and their gaps in one scan.. Same three approved requirements in every alternative. Filter results is selected and has no implementation or test links.</desc><rect x="0" y="0" width="1100" height="560" rx="5" fill="#f7f8fa" stroke="#f7f8fa"/><text x="32" y="47" font-family="Arial, sans-serif" font-size="27" fill="#26313d">A  Coverage grid</text><text x="32" y="76" font-family="Arial, sans-serif" font-size="16" fill="#647080">Compare several requirements and their gaps in one scan.</text><rect x="30" y="100" width="1040" height="400" rx="5" fill="#fff" stroke="#cbd0d8"/><text x="54" y="140" font-family="Arial, sans-serif" font-size="22" fill="#26313d">Find suitable services</text><text x="54" y="166" font-family="Arial, sans-serif" font-size="14" fill="#647080">Approved intent  /  3 requirements</text><text x="730" y="134" font-family="Arial, sans-serif" font-size="14" fill="#7b6032">1 code link missing · 2 test links missing</text><line x1="54" y1="183" x2="1046" y2="183" stroke="#b6bec9"/><text x="70" y="217" font-family="Arial, sans-serif" font-size="15" fill="#647080">Requirement</text><text x="480" y="217" font-family="Arial, sans-serif" font-size="15" fill="#647080">Implementation</text><text x="790" y="217" font-family="Arial, sans-serif" font-size="15" fill="#647080">Tests</text><rect x="54" y="240" width="992" height="62" rx="5" fill="#fff" stroke="#e0e4e9"/><text x="70" y="275" font-family="Arial, sans-serif" font-size="18" fill="#26313d">01  Browse categories</text><text x="480" y="275" font-family="Arial, sans-serif" font-size="18" fill="#26313d">discovery.ts</text><text x="790" y="274" font-family="Arial, sans-serif" font-size="17" fill="#26313d">discovery.spec.ts</text><rect x="54" y="311" width="992" height="80" rx="5" fill="#eef4ff" stroke="#6589c2"/><text x="70" y="347" font-family="Aria