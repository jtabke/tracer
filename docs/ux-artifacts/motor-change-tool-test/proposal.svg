<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" role="img" aria-labelledby="title desc"><title id="title">1 · Define the proposed change</title><desc id="desc">One change is the starting point—not a list of new requirements. Disposable low-fidelity layout preview; not a technical analysis.</desc>
<rect x="0" y="0" width="1160" height="820" fill="#fff" stroke="#20252b"/>
<text x="28" y="40" font-family="Arial, sans-serif" font-size="16" fill="#20252b"><tspan x="28" dy="0">TRACER · TOOL TEST ONLY · NOT A SELECTED UI</tspan></text>
<text x="28" y="90" font-family="Arial, sans-serif" font-size="30" fill="#20252b"><tspan x="28" dy="0">1 · Define the proposed change</tspan></text>
<text x="28" y="124" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="28" dy="0">One change is the starting point—not a list of new requirements.</tspan></text>
<rect x="28" y="140" width="212" height="560" fill="#f3f4f6" stroke="#20252b"/>
<text x="44" y="178" font-family="Arial, sans-serif" font-size="16" fill="#20252b"><tspan x="44" dy="0">WORKING CONTEXT</tspan></text>
<text x="44" y="220" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="44" dy="0">Medication-delivery</tspan><tspan x="44" dy="22.5">device</tspan><tspan x="44" dy="22.5"></tspan><tspan x="44" dy="22.5">Software</tspan><tspan x="44" dy="22.5">Motor / drive</tspan><tspan x="44" dy="22.5">Mechanical design</tspan><tspan x="44" dy="22.5">System requirements</tspan><tspan x="44" dy="22.5">Verification evidence</tspan></text>
<text x="274" y="174" font-family="Arial, sans-serif" font-size="26" fill="#20252b"><tspan x="274" dy="0">Proposed change: software motor limit</tspan></text>
<rect x="274" y="204" width="840" height="108" fill="#fff" stroke="#20252b"/>
<text x="294" y="240" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="294" dy="0">Established → proposed</tspan><tspan x="294" dy="22.5">The limit type, values and reason have not been supplied.</tspan><tspan x="294" dy="22.5">We are testing the workflow, not choosing a device setting.</tspan></text>
<rect x="274" y="338" width="404" height="182" fill="#fff" stroke="#20252b"/>
<text x="294" y="374" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="294" dy="0">Keep the system intent visible</tspan><tspan x="294" dy="22.5"></tspan><tspan x="294" dy="22.5">Deliver precise medication.</tspan><tspan x="294" dy="22.5">Exact requirement wording and</tspan><tspan x="294" dy="22.5">acceptance limits are not supplied.</tspan></text>
<rect x="702" y="338" width="412" height="182" fill="#fff" stroke="#20252b"/>
<text x="722" y="374" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="722" dy="0">Questions before making a change</tspan><tspan x="722" dy="22.5"></tspan><tspan x="722" dy="22.5">What is changing, and why?</tspan><tspan x="722" dy="22.5">Which established version is relevant?</tspan><tspan x="722" dy="22.5">What should remain unchanged?</tspan></text>
<text x="274" y="576" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="274" dy="0">A connected item is a candidate to investigate—not proof that</tspan><tspan x="274" dy="22.5">it must change. Unmodeled effects may still exist.</tspan></text>
<rect x="274" y="634" width="382" height="54" fill="#f3f4f6" stroke="#20252b"/><text x="288" y="667" font-family="Arial, sans-serif" font-size="18" fill="#20252b">Explore possible consequences</text>
<text x="28" y="776" font-family="Arial, sans-serif" font-size="16" fill="#20252b"><tspan x="28" dy="0">Illustrative workflow only. No engineering conclusion or committed change.</tspan></text>
</svg>
