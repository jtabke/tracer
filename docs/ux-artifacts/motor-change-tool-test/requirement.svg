<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" role="img" aria-labelledby="title desc"><title id="title">3 · Assess system-level satisfaction</title><desc id="desc">Changed implementation does not necessarily mean changed intent. Disposable low-fidelity layout preview; not a technical analysis.</desc>
<rect x="0" y="0" width="1160" height="820" fill="#fff" stroke="#20252b"/>
<text x="28" y="40" font-family="Arial, sans-serif" font-size="16" fill="#20252b"><tspan x="28" dy="0">TRACER · TOOL TEST ONLY · NOT A SELECTED UI</tspan></text>
<text x="28" y="90" font-family="Arial, sans-serif" font-size="30" fill="#20252b"><tspan x="28" dy="0">3 · Assess system-level satisfaction</tspan></text>
<text x="28" y="124" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="28" dy="0">Changed implementation does not necessarily mean changed intent.</tspan></text>
<rect x="28" y="136" width="1086" height="110" fill="#f3f4f6" stroke="#20252b"/>
<text x="48" y="174" font-family="Arial, sans-serif" font-size="20" fill="#20252b"><tspan x="48" dy="0">System intent: deliver precise medication</tspan><tspan x="48" dy="25">The established target may remain unchanged. Exact wording/limits are not supplied.</tspan><tspan x="48" dy="25">Continued satisfaction after the proposed change has not been established.</tspan></text>
<rect x="28" y="278" width="526" height="254" fill="#fff" stroke="#20252b"/>
<text x="48" y="318" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="48" dy="0">Questions for the engineer</tspan><tspan x="48" dy="22.5"></tspan><tspan x="48" dy="22.5">How does the software change relate to</tspan><tspan x="48" dy="22.5">motor/drive and mechanical behavior?</tspan><tspan x="48" dy="22.5"></tspan><tspan x="48" dy="22.5">Do their combined contributions still</tspan><tspan x="48" dy="22.5">satisfy the system requirement?</tspan><tspan x="48" dy="22.5"></tspan><tspan x="48" dy="22.5">What assumptions need confirmation?</tspan></text>
<rect x="582" y="278" width="532" height="254" fill="#fff" stroke="#20252b"/>
<text x="602" y="318" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="602" dy="0">Evidence to find and assess</tspan><tspan x="602" dy="22.5"></tspan><tspan x="602" dy="22.5">Relevant requirement and design versions</tspan><tspan x="602" dy="22.5">Interface definitions / engineering rationale</tspan><tspan x="602" dy="22.5">Original verification inputs and results</tspan><tspan x="602" dy="22.5"></tspan><tspan x="602" dy="22.5">What needs investigation or verification</tspan><tspan x="602" dy="22.5">must be decided—not inferred from a link.</tspan></text>
<text x="28" y="582" font-family="Arial, sans-serif" font-size="18" fill="#20252b"><tspan x="28" dy="0">Candidate next action: investigate the combined contribution and decide</tspan><tspan x="28" dy="22.5">which verification activities need reassessment. Nothing has been saved.</tspan></text>
