<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracer · project shell study</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body data-project="orbit" data-model-fixture="orbit-clean-v1">
    <div class="shell">
      <aside class="project-rail" id="project-rail" aria-label="Project navigation">
        <header class="project-switch-row">
          <div class="project-switcher">
            <button
              class="project-switch"
              type="button"
              data-project-switch
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="project-menu"
              aria-label="Switch project. Current project Orbit R1"
            >
              <span class="project-mark" data-project-mark aria-hidden="true">O</span>
              <span class="active-project">
                <strong data-project-name>Orbit R1</strong>
                <small data-project-kind>Integrated product</small>
              </span>
              <span class="project-chevron" aria-hidden="true">⌄</span>
            </button>
            <div
              class="project-menu"
              id="project-menu"
              data-project-menu
              role="listbox"
              aria-label="Projects"
              hidden
            >
              <button
                class="project-option"
                type="button"
                role="option"
                data-project="orbit"
                aria-selected="true"
              >
                <span class="project-mark" aria-hidden="true">O</span>
                <span><strong>Orbit R1</strong><small>Integrated product</small></span>
                <span class="project-check" aria-hidden="true">✓</span>
              </button>
              <button
                class="project-option"
                type="button"
                role="option"
                data-project="aster"
                aria-selected="false"
              >
                <span class="project-mark aster" aria-hidden="true">A</span>
                <span><strong>Aster Home BP</strong><small>Medical device</small></span>
                <span class="project-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>
          <button class="rail-close" type="button" data-close-rail aria-label="Close navigation">
            ×
          </button>
        </header>

        <nav>
          <p>Work</p>
          <button class="nav-item" type="button" data-section="overview">
            <span aria-hidden="true">⌂</span><span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-section="items">
            <span aria-hidden="true">▤</span><span>Items</span>
          </button>
          <div class="item-scopes" data-item-scopes>
            <button type="button" data-item-mode="scope">
              <span>Current scope</span>
            </button>
            <button type="button" data-item-mode="saved"><span>Saved scopes</span></button>
            <button type="button" data-item-mode="all"><span>All items</span></button>
          </div>
          <button class="nav-item" type="button" data-section="results">
            <span aria-hidden="true">◫</span><span>Captured results</span>
          </button>
          <button class="nav-item" type="button" data-section="configurations">
            <span aria-hidden="true">◇</span><span>Captured configurations</span>
          </button>

          <p>Project</p>
          <button class="nav-item" type="button" data-section="model">
            <span aria-hidden="true">⌘</span><span>Project model</span>
          </button>
        </nav>

        <footer><span>Current data</span><span data-schema-version>Loading schema…</span></footer>
      </aside>

      <button
        class="rail-scrim"
        type="button"
        data-close-rail
        aria-label="Close navigation"
      ></button>

      <div class="shell-main">
        <header class="global-bar">
          <button class="mobile-menu" type="button" data-open-rail aria-label="Open navigation">
            ☰
          </button>
          <div class="breadcrumbs" data-breadcrumbs></div>
        </header>
        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>
    <script src="model-graph.js"></script>
    <script src="model-editor.js"></script>
    <script src="project-fixtures.js"></script>
    <script src="orbit-overview.js"></script>
    <script src="medical.js"></script>
    <script type="module" src="project-switch.js"></script>
  </body>
</html>
