  .hair{stroke:#3A3A36;stroke-width:1}.route{fill:none;stroke:#268EA6;stroke-width:3;stroke-linecap:round}.routeCyan{fill:none;stroke:#29CDF2;stroke-width:3;stroke-linecap:round}.routeCream{fill:none;stroke:#D9D3C1;stroke-width:2;stroke-linecap:round}.routeMuted{fill:none;stroke:#696861;stroke-width:2;stroke-linecap:round}.routeGhost{fill:none;stroke:#343431;stroke-width:9;stroke-linecap:round}
  .node{fill:#1B1B1B;stroke:#5A5952;stroke-width:1.2}.nodeBright{fill:#12323A;stroke:#29CDF2;stroke-width:2}.nodeCore{fill:#182C30;stroke:#6CBFD1;stroke-width:1.5}.station{fill:#0D0D0D;stroke:#D9D3C1;stroke-width:3}.stationCyan{fill:#0D0D0D;stroke:#29CDF2;stroke-width:4}.stationSmall{fill:#0D0D0D;stroke:#8B8980;stroke-width:2}
</style><rect width="1440" height="900" fill="#0D0D0D"/><rect x="0" y="0" width="1440" height="72" rx="0" class="quiet" /><rect x="0" y="0" width="8" height="72" fill="#29CDF2"/>
