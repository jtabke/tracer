<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#343431" stroke-width="1" opacity=".28"/></pattern>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D9D3C1" opacity=".11"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".45"/></filter>
  <marker id="arrow-cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#29CDF2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-cream" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#D9D3C1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#77756D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
  svg{background:#0D0D0D;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-rendering:geometricPrecision}
